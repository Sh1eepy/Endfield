name: RAG quality gate

on:
  push:
    paths: ["scripts/**", "tests/**", "output/eval/**", "output/rag/**", ".github/workflows/rag-quality.yml"]
  pull_request:
    paths: ["scripts/**", "tests/**", "output/eval/**", "output/rag/**"]

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install rank-bm25 jieba httpx
      - run: python -m unittest tests.test_build_rag tests.test_intent_router tests.test_rag_monitor
      - run: python scripts/quality_gate.py
