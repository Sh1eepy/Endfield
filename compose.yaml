name: endfield

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: endfield-synthesis:local
    container_name: endfield-synthesis
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      ASK_MAX_CONCURRENCY: ${ASK_MAX_CONCURRENCY:-2}
      ASK_BUDGET_DB: /var/lib/endfield-security/ask-budget.sqlite3
      # Leave forwarding trust empty until the exact reverse-proxy peer is known.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
    volumes:
      - api-security:/var/lib/endfield-security
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-security:
