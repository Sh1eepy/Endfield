# 把 YOUR_SUBDOMAIN.example.com 替换成实际子域名后放入 /etc/nginx/sites-available/endfield。
# 本文件先提供 HTTP；确认域名可访问后执行 certbot --nginx，由 Certbot 自动补 HTTPS 与续期配置。

# 知识问答会调用付费 LLM：单 IP 平均每分钟 6 次，允许短时突发 2 次；并发最多 1 次。
limit_req_zone $binary_remote_addr zone=endfield_ask_rate:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=endfield_ask_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN.example.com;

    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 429 = @endfield_rate_limited;

    location @endfield_rate_limited {
        default_type application/json;
        add_header Retry-After "10" always;
        return 429 '{"ok":false,"error":"请求过于频繁，请稍后重试"}';
    }

    # 深度审计和进程指标仅供服务器管理员本机查看，公网健康检查使用 /api/health。
    location ~ ^/api/(health/deep|metrics)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ask {
        limit_req zone=endfield_ask_rate burst=2 nodelay;
        limit_req_status 429;
        limit_conn endfield_ask_conn 1;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
